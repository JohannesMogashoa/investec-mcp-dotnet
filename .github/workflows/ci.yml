name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - run: docker build -t investec-mcp:ci .
      - run: docker build --target protocol-test -t investec-mcp:protocol-test .
      - run: dotnet test -c Release --no-build --filter FullyQualifiedName~DockerProtocolTests
        env:
          INVESTEC_DOCKER_TEST_IMAGE: investec-mcp:protocol-test
          INVESTEC_DOCKER_PRODUCTION_IMAGE: investec-mcp:ci
